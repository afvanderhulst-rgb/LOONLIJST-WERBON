# MIT Werkbon: servercode (map functions) automatisch naar Firebase zetten.
# Draait vanzelf als er op GitHub iets verandert in functions/ of firebase.json,
# of met de hand: GitHub > Actions > "Servercode naar Firebase" > Run workflow.
# Nodig: repository secret FIREBASE_SERVICE_ACCOUNT (de JSON-sleutel van het serviceaccount, zie INSTALLATIE.txt).
name: Servercode naar Firebase

on:
  push:
    branches: [main, master]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/firebase-functions.yml'
  workflow_dispatch:

concurrency:
  group: firebase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Onderdelen installeren (npm install)
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Inloggen bij Google
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Publiceren (firebase deploy --only functions)
        run: npx --yes firebase-tools@latest deploy --only functions --project backup-loonlijst-werkbon-mit --non-interactive --force
