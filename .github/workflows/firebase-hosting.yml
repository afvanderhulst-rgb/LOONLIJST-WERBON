name: App naar Firebase Hosting

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'functions/**'
      - '.github/workflows/firebase-functions.yml'
      - '*.txt'
  workflow_dispatch:

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Code ophalen
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: App bouwen
        run: node build.mjs
      - name: Inloggen bij Google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Site voor de kantoor-app (eenmalig aanmaken)
        run: |
          npx --yes firebase-tools@latest hosting:sites:create mit-kantoor --project backup-loonlijst-werkbon-mit --non-interactive || echo "Site bestaat al of de naam is bezet (zie hierboven)"
      - name: Publiceren
        run: npx --yes firebase-tools@latest deploy --only hosting --project backup-loonlijst-werkbon-mit --non-interactive
