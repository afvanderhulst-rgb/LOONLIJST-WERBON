name: App naar Firebase Hosting

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'functions/**'
      - '.github/workflows/firebase-functions.yml'
      - '*.txt'
  workflow_dispatch:

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Code ophalen
        uses: actions/checkout@v6
      - name: Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: App bouwen
        run: node build.mjs
      - name: Inloggen bij Google
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Publiceren
        run: npx --yes firebase-tools@latest deploy --only hosting --project backup-loonlijst-werkbon-mit --non-interactive
